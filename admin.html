{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<h2>Tableau de Bord Administrateur</h2>
<hr>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3 shadow">
            <div class="card-body">
                <h5 class="card-title">Étudiants</h5>
                <p class="card-text fs-2">{{ stats.etudiants }}</p>
                <a href="{{ url_for('main.list_etudiants') }}" class="btn btn-outline-light btn-sm">Gérer</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3 shadow">
            <div class="card-body">
                <h5 class="card-title">Classes</h5>
                <p class="card-text fs-2">{{ stats.classes }}</p>
                <a href="{{ url_for('main.list_classes') }}" class="btn btn-outline-light btn-sm">Gérer</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-warning mb-3 shadow">
            <div class="card-body">
                <h5 class="card-title">Matières</h5>
                <p class="card-text fs-2">{{ stats.matieres }}</p>
                <a href="{{ url_for('main.list_matieres') }}" class="btn btn-outline-light btn-sm">Gérer</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
