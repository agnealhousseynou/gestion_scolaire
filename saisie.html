{% extends "base.html" %}
{% block title %}Saisie des Notes{% endblock %}
{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h4>Saisie des Notes</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Étudiant</label>
                    <select name="etudiant_id" class="form-select" required>
                        <option value="">Choisir un étudiant...</option>
                        {% for e in etudiants %}
                        <option value="{{ e.id }}">{{ e.matricule }} - {{ e.user.nom }} {{ e.user.prenom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Matière</label>
                    <select name="matiere_id" class="form-select" required>
                        <option value="">Choisir une matière...</option>
                        {% for m in matieres %}
                        <option value="{{ m.id }}">{{ m.nom }} (Coef: {{ m.coefficient }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Note (0-20)</label>
                    <input type="number" step="0.25" min="0" max="20" name="note" class="form-control" required>
                </div>
                <div class="col-md-2 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-success w-100">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
